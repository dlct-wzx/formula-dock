name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.8.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./extension/manifest.json').version")"
          expected_tag="v${package_version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $expected_tag"
            exit 1
          fi

          if [[ "$manifest_version" != "$package_version" ]]; then
            echo "::error::package.json version $package_version does not match extension/manifest.json version $manifest_version"
            exit 1
          fi

      - name: Run project verification
        run: npm run verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          asset="release/formuladock-extension-v${package_version}.zip"
          gh release create "$RELEASE_TAG" "$asset" \
            --verify-tag \
            --title "FormulaDock $RELEASE_TAG" \
            --generate-notes