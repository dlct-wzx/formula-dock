name: Bug report
description: Report a reproducible web application or browser extension problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include MinerU tokens, signed URLs, private images, or personal data in this report.
        Report security issues through the private process in SECURITY.md.

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Browser extension side panel
        - Category interaction or layout
        - Web application
        - MinerU OCR
        - Build or tooling
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behaviour and the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project or extension version
      placeholder: 0.4.1
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Edge 143 / Chrome 142
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove tokens, signed URLs, file paths with personal data, and private images.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include a token, signed upload URL, private image, or personal data.
          required: true
