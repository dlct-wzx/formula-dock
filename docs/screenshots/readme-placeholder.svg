<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">FormulaDock screenshot placeholder</title>
  <desc id="description">A neutral placeholder for a future FormulaDock product screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="0.55" stop-color="#eef4ff" />
      <stop offset="1" stop-color="#f9f7ff" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245be8" />
      <stop offset="1" stop-color="#6b4df3" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#dce6f7" stroke-width="1" opacity="0.65" />
    </pattern>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)" />
  <rect width="1200" height="675" rx="28" fill="url(#grid)" />
  <rect x="36" y="36" width="1128" height="603" rx="24" fill="#ffffff" fill-opacity="0.82" stroke="#cfdcf2" stroke-width="2" />
  <rect x="66" y="66" width="1068" height="543" rx="18" fill="none" stroke="#b8c9e7" stroke-width="2" stroke-dasharray="12 10" />

  <g transform="translate(510 185)">
    <rect width="180" height="126" rx="24" fill="url(#mark)" />
    <rect x="28" y="24" width="124" height="76" rx="10" fill="#ffffff" fill-opacity="0.94" />
    <rect x="44" y="42" width="58" height="7" rx="3.5" fill="#5f7fe4" />
    <rect x="44" y="59" width="84" height="7" rx="3.5" fill="#b4c1dd" />
    <rect x="44" y="76" width="66" height="7" rx="3.5" fill="#b4c1dd" />
    <path d="M73 110 L91 110 L98 120 L66 120 Z" fill="#ffffff" fill-opacity="0.94" />
  </g>

  <text x="600" y="382" text-anchor="middle" fill="#17233e" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700">Screenshot placeholder</text>
  <text x="600" y="432" text-anchor="middle" fill="#4b5e80" font-family="'Microsoft YaHei', 'Segoe UI', Arial, sans-serif" font-size="26">截图占位符</text>
  <text x="600" y="486" text-anchor="middle" fill="#8190aa" font-family="'Segoe UI', Arial, sans-serif" font-size="20">The final FormulaDock screenshot will appear here.</text>
  <text x="600" y="520" text-anchor="middle" fill="#8190aa" font-family="'Microsoft YaHei', 'Segoe UI', Arial, sans-serif" font-size="19">最终产品截图将在这里替换。</text>

  <g transform="translate(534 564)">
    <circle cx="8" cy="8" r="5" fill="#245be8" />
    <text x="24" y="14" fill="#5f7190" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1">FORMULADOCK</text>
  </g>
</svg>