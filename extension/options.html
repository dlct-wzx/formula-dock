<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="title">FormulaDock 插件设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="header-inner">
        <a class="brand" href="sidepanel.html" aria-label="打开 FormulaDock 侧边栏" data-i18n-aria-label="brandAria">
          <img src="icons/icon48.png" width="40" height="40" alt="" />
          <span>
            <strong>FormulaDock</strong>
            <small data-i18n="subtitle">浏览器扩展设置</small>
          </span>
        </a>
        <span class="version-pill">v<span id="version">0.6.0</span></span>
      </div>
    </header>

    <main class="settings-shell">
      <section class="intro">
        <span class="eyebrow">EXTENSION SETTINGS</span>
        <h1 data-i18n="introTitle">连接 MinerU，并为公式工作台设置舒适的界面。</h1>
        <p data-i18n-html="introBody">
          Token 只保存在当前浏览器的 <code>chrome.storage.local</code>，不会写入项目源码，也不会上传到本项目的 Web 服务。
        </p>
      </section>

      <form id="settingsForm" class="settings-form">
        <section class="settings-card">
          <div class="card-heading">
            <div>
              <span class="section-number">01</span>
              <h2 data-i18n="interfaceTitle">界面设置</h2>
              <p data-i18n="interfaceDesc">调整界面语言和 LaTeX 编辑器字号。</p>
            </div>
          </div>

          <div class="field-row">
            <label class="field">
              <span class="field-label">
                <span data-i18n="uiLanguage">界面语言</span>
                <small data-i18n="uiLanguageHint">切换侧边栏和设置页语言</small>
              </span>
              <select id="uiLocale" name="uiLocale">
                <option value="zh">中文</option>
                <option value="en">English</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">
                <span data-i18n="interfaceScale">界面字号</span>
                <small data-i18n="interfaceScaleHint">调整工具、按钮和说明文字</small>
              </span>
              <select id="interfaceScale" name="interfaceScale">
                <option value="90" data-i18n="scaleSmall">小（90%）</option>
                <option value="100" data-i18n="scaleStandard">标准（100%）</option>
                <option value="110" data-i18n="scaleComfortable">较大（110%）</option>
                <option value="140" data-i18n="scaleLarge">大（140%）</option>
                <option value="160" data-i18n="scaleExtraLarge">特大（160%）</option>
              </select>
            </label>
          </div>

          <label class="field field--wide">
            <span class="field-label">
              <span data-i18n="editorFontSize">编辑器字号</span>
              <small data-i18n="editorFontSizeHint">10–24 px</small>
            </span>
            <span class="input-with-unit">
              <input id="editorFontSize" name="editorFontSize" type="number" min="10" max="24" step="1" value="12" />
              <span>px</span>
            </span>
          </label>
        </section>

        <section class="settings-card">
          <div class="card-heading">
            <div>
              <span class="section-number">02</span>
              <h2 data-i18n="mineruTitle">MinerU 图片识别</h2>
              <p data-i18n="mineruDesc">插件直接调用 MinerU 精准解析 API，不依赖本地 Node 服务。</p>
            </div>
            <a href="https://mineru.net/apiManage/docs" target="_blank" rel="noreferrer" data-i18n="apiDocs">API 文档 ↗</a>
          </div>

          <label class="field field--wide">
            <span class="field-label">
              <span data-i18n="tokenLabel">API Token</span>
              <small data-i18n="tokenHint">必填，保存在本机扩展存储中</small>
            </span>
            <span class="token-control">
              <input
                id="mineruToken"
                name="mineruToken"
                type="password"
                autocomplete="off"
                spellcheck="false"
                placeholder="粘贴 MinerU API Token"
                data-i18n-placeholder="tokenPlaceholder"
              />
              <button id="toggleToken" type="button" class="inline-button" data-i18n="show">显示</button>
            </span>
          </label>

          <div class="field-row">
            <label class="field">
              <span class="field-label">
                <span data-i18n="modelLabel">模型</span>
                <small data-i18n="modelHint">图片公式推荐 VLM</small>
              </span>
              <select id="modelVersion" name="modelVersion">
                <option value="vlm" data-i18n="modelVlm">MinerU VLM（推荐）</option>
                <option value="pipeline" data-i18n="modelPipeline">MinerU Pipeline</option>
              </select>
            </label>

            <label class="field">
              <span class="field-label">
                <span data-i18n="ocrLanguageLabel">OCR 语言</span>
                <small data-i18n="ocrLanguageHint">影响中文/英文识别</small>
              </span>
              <select id="language" name="language">
                <option value="ch" data-i18n="ocrLanguageCh">中文 + English</option>
                <option value="en" data-i18n="ocrLanguageEn">English</option>
              </select>
            </label>
          </div>

        </section>

        <section class="settings-actions">
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <div class="action-buttons">
            <button id="testButton" type="button" class="button button--secondary" data-i18n="testToken">测试 Token</button>
            <button id="saveButton" type="submit" class="button button--primary" data-i18n="save">保存设置</button>
          </div>
        </section>
      </form>
    </main>

    <footer class="page-footer">
      <span>FormulaDock</span>
      <span>Manifest V3 · Chrome / Edge 116+</span>
    </footer>

    <script src="options.js"></script>
  </body>
</html>
